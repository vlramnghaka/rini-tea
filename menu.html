<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rint Tea Stall | Menus and dishes">
  <title>Menu | Rini Tea Stall</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu">

  <!-- Shared Header -->
  <header class="navbar">
    <div class="logo">
      <img src="favicon.svg" alt="Rini Tea Stall Logo">
      <span>Rini Tea Stall</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html#home">Home</a></li>
        <li><a href="menus.html">Menu</a></li>
        <li><a href="index.html#about">About Us</a></li>
        <li><a href="index.html#contact">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Menu Container -->
  <main class="menu-page-container">
    
    <!-- Search & Category Filters -->
    <section class="search-section">
      <input type="text" id="search-bar" class="search-input" placeholder="Search menu items (e.g., Tea, Chowmein)...">
      <div class="category-filters" id="category-buttons">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Rini's Special">Exclusive</button>
        <button class="filter-btn" data-category="Chow">Chow</button>
        <button class="filter-btn" data-category="Fried Rice">Fried Rice</button>
        <button class="filter-btn" data-category="Chowmein">Chowmein</button>
        <button class="filter-btn" data-category="Momo">Momo</button>
        <button class="filter-btn" data-category="Rolls">Rolls</button>
        <button class="filter-btn" data-category="Cold Drinks">Cold Drinks</button>
        <button class="filter-btn" data-category="Meat">Meat</button>
        <button class="filter-btn" data-category="Rice Porridge">Rice Porridge</button>
        <button class="filter-btn" data-category="Other">Other</button>
      </div>
    </section>

    <!-- Menu Cards Grid -->
    <section id="menu-grid" class="menu-grid">
      <!-- Menu items will be dynamically generated by script.js -->
    </section>

  </main>

  <!-- Detail Popup Modal -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal" class="close-btn">&times;</span>
      <img id="modal-img" class="modal-img" src="" alt="Menu Item">
      <div class="modal-body">
        <span id="modal-category" class="modal-category">Category</span>
        <h2 id="modal-name">Item Name</h2>
        <div id="modal-price" class="modal-price">₹ 0 / pack</div>
        
        <div class="desc-block">
          <strong>MIZO:</strong>
          <p id="modal-desc-mizo" lang="lus">-</p>
        </div>
        
        <div class="desc-block">
          <strong>ENGLISH:</strong>
          <p id="modal-desc-en">-</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 Rini Tea Stall. All Rights Reserved. | Created by <a href="tel:+919362878316">VL Ramnghaka</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
